apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-about
  namespace: id-039
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-about
  template:
    metadata:
      labels:
        app: app-about
    spec:
      containers:
        - name: app-about
          image: app-about:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: app-about-svc
  namespace: id-039
spec:
  type: ClusterIP
  selector:
    app: app-about
  ports:
    - port: 80
      targetPort: 5000