apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-web-039
  namespace: id-039
spec:
  ingressClassName: nginx
  rules:
    - host: id-039.com
      http:
        paths:
          - path: /about
            pathType: Prefix
            backend:
              service:
                name: app-about-svc
                port:
                  number: 80
          - path: /research
            pathType: Prefix
            backend:
              service:
                name: app-research-svc
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: app-api-svc
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-research-svc
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-api-039
  namespace: id-039
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: id-039.com
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: app-api-svc
                port:
                  number: 80